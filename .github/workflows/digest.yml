name: IT-Sicherheitsdigest
on:
  schedule:
    - cron: "0 7,16 * * *"   # ca. 08:00 und 17:00 Uhr MEZ
  workflow_dispatch:
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: secwatch.db
          key: secwatch-db-${{ github.run_id }}
          restore-keys: secwatch-db-
      - run: python3 secwatch.py --config config.json
      - uses: actions/upload-artifact@v4
        with:
          name: digest-latest
          path: digests/
          retention-days: 14
